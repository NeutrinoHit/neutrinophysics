<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img"><title>Два реликтовых фона Вселенной</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1500" height="430" fill="#000"/><rect x="20" y="60" width="460" height="120" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="250.0" y="111.41999999999999" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="250.0" dy="0">t ≈ 1 с</tspan><tspan x="250.0" dy="33.800000000000004">Нейтрино отделяются, T ≈ 1 МэВ</tspan></text><rect x="530" y="60" width="460" height="120" rx="12" fill="#101820" stroke="#b8c7d1" stroke-width="2.5"/><text x="760.0" y="111.41999999999999" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="760.0" dy="0">t ≈ неск. минут</tspan><tspan x="760.0" dy="33.800000000000004">Первичный нуклеосинтез</tspan></text><rect x="1040" y="60" width="440" height="120" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="1260.0" y="111.41999999999999" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="1260.0" dy="0">t ≈ 380 000 лет</tspan><tspan x="1260.0" dy="33.800000000000004">Атомы, свет отделяется — CMB</tspan></text><path d="M480,120 L525,120" fill="none" stroke="#b8c7d1" stroke-width="3" marker-end="url(#arrow)"/><path d="M990,120 L1035,120" fill="none" stroke="#b8c7d1" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="30" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="750" dy="0">Расширение и остывание Вселенной</tspan></text><rect x="20" y="250" width="1460" height="130" rx="12" fill="#101820" stroke="#75ddb8" stroke-width="2.5"/><text x="750.0" y="306.09" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" font-weight="normal"><tspan x="750.0" dy="0">Сегодня: T_γ ≈ 2,725 К (CMB), T_ν ≈ 1,95 К (реликтовые нейтрино)</tspan><tspan x="750.0" dy="35.1">Нейтринный фон — снимок Вселенной в 380 000 раз более ранней, чем CMB</tspan></text></svg>
