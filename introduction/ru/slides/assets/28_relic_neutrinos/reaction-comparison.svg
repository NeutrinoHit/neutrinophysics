<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="460" viewBox="0 0 1520 460" role="img"><title>Одна и та же ядерная неустойчивость — три реакции</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1520" height="460" fill="#000"/><rect x="20" y="40" width="460" height="150" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="250.0" y="90.5" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="250.0" dy="0">β⁻-распад</tspan><tspan x="250.0" dy="32.5">³H → ³He + e⁻ + ν̄ₑ</tspan><tspan x="250.0" dy="32.5">порог не нужен: идёт сам</tspan></text><rect x="530" y="40" width="460" height="150" rx="12" fill="#101820" stroke="#ff9ab0" stroke-width="2.5"/><text x="760.0" y="90.5" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="760.0" dy="0">Обратный β-распад</tspan><tspan x="760.0" dy="32.5">ν̄ₑ + p → n + e⁺</tspan><tspan x="760.0" dy="32.5">порог ≈ 1,8 МэВ</tspan></text><rect x="1040" y="40" width="460" height="150" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="1270.0" y="75.88" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="1270.0" dy="0">Захват νₑ на тритии</tspan><tspan x="1270.0" dy="31.200000000000003">νₑ + ³H → ³He + e⁻</tspan><tspan x="1270.0" dy="31.200000000000003">порога нет — ядро и так</tspan><tspan x="1270.0" dy="31.200000000000003">готово распасться</tspan></text><text x="760" y="250" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="760" dy="0">Захват — это распад, у которого забрали энергию, а не отняли.</tspan></text><text x="760" y="300" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="760" dy="0">Электрон уносит всю энергию перехода целиком, плюс энергию нейтрино.</tspan></text><path d="M760,340 L760,400" fill="none" stroke="#75ddb8" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="440" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="760" dy="0">Наблюдаемый сигнал: линия на E₀ + mβ, выше края обычного спектра</tspan></text></svg>
