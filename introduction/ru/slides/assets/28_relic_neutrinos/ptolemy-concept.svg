<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="460" viewBox="0 0 1480 460" role="img"><title>Идея PTOLEMY: от графена с тритием к энергии электрона</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1480" height="460" fill="#000"/><rect x="20" y="165" width="330" height="130" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="185.0" y="221.42" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="185.0" dy="0">Графен</tspan><tspan x="185.0" dy="33.800000000000004">с атомами трития</tspan></text><rect x="390" y="165" width="330" height="130" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="555.0" y="204.51999999999998" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="555.0" dy="0">Магнитная и</tspan><tspan x="555.0" dy="33.800000000000004">электростатическая</tspan><tspan x="555.0" dy="33.800000000000004">транспортировка</tspan></text><rect x="760" y="165" width="330" height="130" rx="12" fill="#101820" stroke="#75ddb8" stroke-width="2.5"/><text x="925.0" y="221.42" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="925.0" dy="0">Высокоточный</tspan><tspan x="925.0" dy="33.800000000000004">калориметр (TES)</tspan></text><rect x="1130" y="165" width="330" height="130" rx="12" fill="#101820" stroke="#ff9ab0" stroke-width="2.5"/><text x="1295.0" y="221.42" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="1295.0" dy="0">Энергия электрона</tspan><tspan x="1295.0" dy="33.800000000000004">с точностью ~50 мэВ</tspan></text><path d="M350,230 L390,230" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,230 L760,230" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1090,230 L1130,230" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="80" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="740" dy="0">Главная нерешённая задача: ровный монослой ~100 г трития на графене.</tspan></text></svg>
