<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="610" viewBox="0 0 1020 610" role="img"><title>Internal conversion of the 32.15 keV transition in krypton-83</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1020" height="610" fill="#000"/><text x="190" y="50" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" font-weight="normal"><tspan x="190" dy="0">Nuclear levels</tspan></text><path d="M75,115 L335,115" stroke="#7cc7ff" stroke-width="4"/><path d="M75,375 L335,375" stroke="#7cc7ff" stroke-width="4"/><path d="M75,500 L335,500" stroke="#b8c7d1" stroke-width="3"/><text x="90" y="101" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="normal"><tspan x="90" dy="0">41.6 keV</tspan></text><text x="90" y="409" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="normal"><tspan x="90" dy="0">9.4 keV</tspan></text><text x="90" y="538" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="normal"><tspan x="90" dy="0">0</tspan></text><path d="M290,130 L290,358" fill="none" stroke="#ffcc8a" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="260" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="start" font-weight="normal"><tspan x="80" dy="0">ΔE<tspan baseline-shift="sub" font-size="70%">nucl</tspan></tspan><tspan x="80" dy="35.1">32.15 keV</tspan></text><path d="M205,390 L205,486" fill="none" stroke="#b8c7d1" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="170" width="495" height="205" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="697.5" y="247.01999999999998" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="697.5" dy="0">The transition energy goes</tspan><tspan x="697.5" dy="33.800000000000004">to a K-shell electron.</tspan><tspan x="697.5" dy="33.800000000000004">The electron leaves the atom.</tspan></text><path d="M340,245 L435,245" fill="none" stroke="#ffcc8a" stroke-width="3" marker-end="url(#arrow)"/><text x="698" y="449" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="698" dy="0">E<tspan baseline-shift="sub" font-size="70%">conv</tspan> ≈ 32.15 − 14.33 = 17.82 keV</tspan></text><text x="698" y="500" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="normal"><tspan x="698" dy="0">Part of the energy is spent on binding.</tspan></text><text x="698" y="550" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="698" dy="0">The alternative channel: γ-ray emission.</tspan></text></svg>
