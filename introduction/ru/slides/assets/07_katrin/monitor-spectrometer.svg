<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="535" viewBox="0 0 1240 535" role="img"><title>Главный и мониторный спектрометры связаны электрически</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1240" height="535" fill="#000"/><rect x="365" y="25" width="510" height="85" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="620.0" y="76.46000000000001" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="620.0" dy="0">Общее высокое напряжение U</tspan></text><path d="M620,110 L620,165" stroke="#ffcc8a" stroke-width="3"/><path d="M265,165 L975,165" stroke="#ffcc8a" stroke-width="3"/><path d="M265,165 L265,250" fill="none" stroke="#ffcc8a" stroke-width="3" marker-end="url(#arrow)"/><path d="M975,165 L975,250" fill="none" stroke="#ffcc8a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="260" width="450" height="135" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="265.0" y="318.26" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="265.0" dy="0">Главный спектрометр</tspan><tspan x="265.0" dy="36.4">β-спектр трития</tspan></text><rect x="750" y="260" width="450" height="135" rx="12" fill="#101820" stroke="#75ddb8" stroke-width="2.5"/><text x="975.0" y="318.26" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="975.0" dy="0">Мониторный спектрометр</tspan><tspan x="975.0" dy="36.4">Линия ⁸³ᵐKr</tspan></text><text x="265" y="454" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="265" dy="0">Измеряет форму конца спектра.</tspan></text><text x="975" y="454" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="975" dy="0">Следит за положением линии.</tspan></text><text x="620" y="512" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="620" dy="0">Два независимых электронных пучка; общая шкала напряжения.</tspan></text></svg>
