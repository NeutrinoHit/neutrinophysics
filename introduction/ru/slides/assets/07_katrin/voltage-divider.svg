<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img"><title>Прецизионный делитель высокого напряжения</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1000" height="550" fill="#000"/><text x="160" y="75" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="normal"><tspan x="160" dy="0">U ≈ −18,6 кВ</tspan></text><path d="M160,95 L160,150" stroke="#ffcc8a" stroke-width="3"/><rect x="110" y="150" width="100" height="150" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="160.0" y="235.24" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="normal"><tspan x="160.0" dy="0">R₁</tspan></text><path d="M160,300 L160,365" stroke="#ffcc8a" stroke-width="3"/><rect x="110" y="365" width="100" height="70" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="160.0" y="410.24" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="normal"><tspan x="160.0" dy="0">R₂</tspan></text><path d="M160,435 L160,490" stroke="#b8c7d1" stroke-width="3"/><path d="M125,490 L195,490" stroke="#b8c7d1" stroke-width="3"/><path d="M137,500 L183,500" stroke="#b8c7d1" stroke-width="3"/><path d="M150,510 L170,510" stroke="#b8c7d1" stroke-width="3"/><path d="M160,333 L385,333" stroke="#7cc7ff" stroke-width="3"/><rect x="385" y="275" width="475" height="116" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="622.5" y="324.42" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="622.5" dy="0">Прецизионный вольтметр</tspan><tspan x="622.5" dy="33.800000000000004">u ≈ −9,4 В</tspan></text><path d="M860,333 L940,333" stroke="#7cc7ff" stroke-width="3"/><path d="M940,333 L940,420" stroke="#7cc7ff" stroke-width="3"/><path d="M910,420 L970,420" stroke="#b8c7d1" stroke-width="3"/><path d="M921,430 L959,430" stroke="#b8c7d1" stroke-width="3"/><path d="M933,440 L947,440" stroke="#b8c7d1" stroke-width="3"/><text x="620" y="100" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="31" text-anchor="middle" font-weight="normal"><tspan x="620" dy="0">u = U · R₂ / (R₁ + R₂)</tspan></text><text x="620" y="165" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="31" text-anchor="middle" font-weight="normal"><tspan x="620" dy="0">U = M · u,    M ≈ 2000</tspan></text><text x="620" y="475" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="620" dy="0">Коэффициент M измеряют для всего делителя</tspan><tspan x="620" dy="31.200000000000003">относительно эталона PTB.</tspan></text></svg>
