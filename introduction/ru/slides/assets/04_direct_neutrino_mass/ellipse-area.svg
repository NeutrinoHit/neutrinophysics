<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-labelledby="title desc">
  <title id="title">Ellipse area</title>
  <desc id="desc">An ellipse in the x y plane with semiaxes a and b.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e3a00"/>
    </marker>
    <marker id="measure-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c64720"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b4400" flood-opacity="0.22"/>
    </filter>
  </defs>

  <line x1="28" y1="105" x2="296" y2="105" stroke="#4e3a00" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <line x1="160" y1="170" x2="160" y2="18" stroke="#4e3a00" stroke-width="2.5" marker-end="url(#axis-arrow)"/>

  <ellipse cx="160" cy="105" rx="105" ry="60" fill="#d7f2f5" fill-opacity="0.9" stroke="#08798b" stroke-width="4" filter="url(#soft-shadow)"/>
  <line x1="160" y1="105" x2="263" y2="105" stroke="#c64720" stroke-width="3" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
  <line x1="160" y1="105" x2="160" y2="47" stroke="#c64720" stroke-width="3" marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
  <circle cx="160" cy="105" r="4" fill="#4e3a00"/>

  <text x="300" y="97" fill="#211700" font-family="Georgia, serif" font-size="23" font-style="italic">x</text>
  <text x="170" y="23" fill="#211700" font-family="Georgia, serif" font-size="23" font-style="italic">y</text>
  <text x="207" y="96" fill="#9f2f15" font-family="Georgia, serif" font-size="22" font-style="italic">a</text>
  <text x="170" y="77" fill="#9f2f15" font-family="Georgia, serif" font-size="22" font-style="italic">b</text>
</svg>
