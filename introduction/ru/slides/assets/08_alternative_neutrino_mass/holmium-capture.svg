<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" role="img"><title>Электронный захват внутри калориметра</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1050" height="680" fill="#000"/><rect x="60" y="100" width="710" height="450" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="415.0" y="333.64" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" font-weight="normal"><tspan x="415.0" dy="0"></tspan></text><text x="415" y="148" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="31" text-anchor="middle" font-weight="normal"><tspan x="415" dy="0">Поглотитель</tspan></text><rect x="245" y="205" width="330" height="80" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="410.0" y="254.92" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="31" text-anchor="middle" font-weight="normal"><tspan x="410.0" dy="0">Атом ¹⁶³Ho</tspan></text><path d="M413,294 L413,350" fill="none" stroke="#ffcc8a" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="365" width="330" height="80" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="410.0" y="395.76" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="410.0" dy="0">Атом ¹⁶³Dy</tspan><tspan x="410.0" dy="36.4">с вакансией</tspan></text><path d="M582,270 L975,270" fill="none" stroke="#ff9ab0" stroke-width="3" marker-end="url(#arrow)"/><text x="860" y="222" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="860" dy="0">νₑ уходит</tspan></text><text x="880" y="318" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="32" text-anchor="middle" font-weight="normal"><tspan x="880" dy="0">Eν</tspan></text><text x="415" y="505" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="415" dy="0">Рентген, оже-электроны, отдача → тепло</tspan></text><path d="M415,558 L415,613" fill="none" stroke="#75ddb8" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="660" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="34" text-anchor="middle" font-weight="normal"><tspan x="415" dy="0">Измерено: Eс = Q − Eν</tspan></text></svg>
