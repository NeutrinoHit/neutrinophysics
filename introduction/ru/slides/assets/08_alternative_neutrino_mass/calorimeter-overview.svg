<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img"><title>От захвата электрона до спектра</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1500" height="520" fill="#000"/><rect x="20" y="150" width="330" height="150" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="185.0" y="216.75" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="185.0" dy="0">Атом ¹⁶³Ho</tspan><tspan x="185.0" dy="32.5">внутри поглотителя</tspan></text><rect x="400" y="150" width="330" height="150" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="565.0" y="216.75" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="565.0" dy="0">Каскад: рентген,</tspan><tspan x="565.0" dy="32.5">оже-электроны, отдача</tspan></text><rect x="780" y="150" width="300" height="150" rx="12" fill="#101820" stroke="#75ddb8" stroke-width="2.5"/><text x="930.0" y="216.75" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="930.0" dy="0">Нагрев поглотителя</tspan><tspan x="930.0" dy="32.5">ΔT = Eс / C</tspan></text><rect x="1130" y="150" width="350" height="150" rx="12" fill="#101820" stroke="#ff9ab0" stroke-width="2.5"/><text x="1305.0" y="216.75" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="1305.0" dy="0">Термометр:</tspan><tspan x="1305.0" dy="32.5">импульс высотой Eс</tspan></text><path d="M355,225 L395,225" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M735,225 L775,225" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1085,225 L1125,225" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M185,145 L185,60" fill="none" stroke="#b8c7d1" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="40" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="185" dy="0">нейтрино уносит Eν</tspan></text><text x="750" y="390" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="34" text-anchor="middle" font-weight="normal"><tspan x="750" dy="0">Измерено: Eс = Q − Eν</tspan></text><text x="750" y="455" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="750" dy="0">Спектр таких импульсов и несёт массу нейтрино.</tspan></text></svg>
