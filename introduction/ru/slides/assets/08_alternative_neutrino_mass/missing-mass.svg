<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><title>Распад покоящегося пиона</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1200" height="400" fill="#000"/><rect x="455" y="120" width="290" height="110" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="600.0" y="165.1" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="normal"><tspan x="600.0" dy="0">Пион</tspan><tspan x="600.0" dy="39.0">покоится</tspan></text><path d="M440,175 L110,175" fill="none" stroke="#ff9ab0" stroke-width="3" marker-end="url(#arrow)"/><path d="M760,175 L1085,175" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="118" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="normal"><tspan x="180" dy="0">Нейтрино</tspan></text><text x="1030" y="118" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="normal"><tspan x="1030" dy="0">Мюон</tspan></text><text x="600" y="300" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="normal"><tspan x="600" dy="0">Импульсы равны по модулю и противоположны.</tspan></text><text x="600" y="350" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="600" dy="0">Измеряем импульс мюона — остальное даёт кинематика.</tspan></text></svg>
