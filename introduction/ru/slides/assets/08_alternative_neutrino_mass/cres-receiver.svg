<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="470" viewBox="0 0 1460 470" role="img"><title>Приём и измерение циклотронного радиосигнала</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1460" height="470" fill="#000"/><rect x="20" y="135" width="240" height="125" rx="12" fill="#101820" stroke="#ffcc8a" stroke-width="2.5"/><text x="140.0" y="189.25" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="140.0" dy="0">Электрон</tspan><tspan x="140.0" dy="32.5">в ловушке</tspan></text><rect x="335" y="135" width="260" height="125" rx="12" fill="#101820" stroke="#7cc7ff" stroke-width="2.5"/><text x="465.0" y="189.25" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="465.0" dy="0">Волновод</tspan><tspan x="465.0" dy="32.5">или резонатор</tspan></text><rect x="670" y="135" width="270" height="125" rx="12" fill="#101820" stroke="#75ddb8" stroke-width="2.5"/><text x="805.0" y="189.25" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="805.0" dy="0">Малошумящий</tspan><tspan x="805.0" dy="32.5">усилитель</tspan></text><rect x="1015" y="135" width="420" height="125" rx="12" fill="#101820" stroke="#ff9ab0" stroke-width="2.5"/><text x="1225.0" y="189.25" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="1225.0" dy="0">Смешение с опорной частотой</tspan><tspan x="1225.0" dy="32.5">и оцифровка</tspan></text><path d="M270,198 L323,198" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M605,198 L658,198" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M950,198 L1003,198" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="75" fill="#f2f2f2" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="725" dy="0">Сигнал сохраняет частоту и фазу циклотронного движения.</tspan></text><text x="260" y="345" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="260" dy="0">Доля фемтоватта</tspan><tspan x="260" dy="33.800000000000004">в приёмной системе</tspan></text><text x="1080" y="345" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="1080" dy="0">Анализ коротких временных участков</tspan><tspan x="1080" dy="33.800000000000004">→ спектрограмма: мощность (t, f)</tspan></text></svg>
