<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Треугольник унитарности и его площадь</title>
  <desc id="desc">Векторы z1, z2, z3 на комплексной плоскости, приставленные друг к другу, замыкают треугольник. Пунктиром достроен параллелограмм на z1 и z2: площадь треугольника равна половине площади параллелограмма.</desc>
  <defs>
    <marker id="arrow-z1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58b8ff"/>
    </marker>
    <marker id="arrow-z2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffc85c"/>
    </marker>
    <marker id="arrow-z3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dd8bff"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa7b1"/>
    </marker>
  </defs>

  <g stroke="#9aa7b1" stroke-width="2" fill="none">
    <line x1="40" y1="400" x2="730" y2="400" marker-end="url(#arrow-axis)"/>
    <line x1="120" y1="525" x2="120" y2="30" marker-end="url(#arrow-axis)"/>
  </g>
  <g fill="#c9d3da" font-family="'STIX Two Text', 'Times New Roman', serif" font-size="30">
    <text x="690" y="440">Re</text>
    <text x="134" y="52">Im</text>
  </g>

  <path d="M120 400 L380 160 L640 250 Z" fill="rgba(126, 226, 174, 0.22)"/>
  <path d="M120 400 L380 490 L640 250" fill="none" stroke="#c9d3da" stroke-width="2.4" stroke-dasharray="10 9"/>

  <g stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="120" y1="400" x2="374.1" y2="165.4" stroke="#58b8ff" marker-end="url(#arrow-z1)"/>
    <line x1="380" y1="160" x2="632.4" y2="247.4" stroke="#ffc85c" marker-end="url(#arrow-z2)"/>
    <line x1="640" y1="250" x2="127.7" y2="397.8" stroke="#dd8bff" marker-end="url(#arrow-z3)"/>
  </g>

  <g font-family="'STIX Two Text', 'Times New Roman', serif" font-style="italic" font-size="40">
    <text x="196" y="262" fill="#58b8ff">z<tspan dy="10" font-size="28" font-style="normal">1</tspan></text>
    <text x="524" y="182" fill="#ffc85c">z<tspan dy="10" font-size="28" font-style="normal">2</tspan></text>
    <text x="384" y="372" fill="#dd8bff">z<tspan dy="10" font-size="28" font-style="normal">3</tspan></text>
    <text x="372" y="282" fill="#eaf6ef" font-size="38">S</text>
  </g>
</svg>
