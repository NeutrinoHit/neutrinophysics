project:
  type: book
  output-dir: ../../../_site/introduction/ru/book
  resources:
    - "assets/chapters/**"
    - "assets/covers/**"

book:
  title: "Введение в физику нейтрино"
  author: "Дмитрий В. Наумов"
  cover-image: assets/covers/front.svg
  site-url: "https://neutrinohit.github.io/neutrinophysics/introduction/ru/book/"
  repo-url: "https://github.com/NeutrinoHit/neutrinophysics"
  repo-subdir: "introduction/ru/book"
  repo-actions: [source, issue]
  search: true
  reader-mode: true
  downloads: [pdf, epub]
  page-footer:
    left: "© Дмитрий В. Наумов"
    right: "NeutrinoHit · Введение в физику нейтрино"
  chapters:
    - index.qmd
    - part: topics/01_neutrinos_weak.qmd
      chapters:
        - chapters/01_neutrino_first_contact.qmd
        - chapters/02_parity_violation.qmd
        - chapters/03_neutrino_spin.qmd
    - part: topics/02_direct_mass.qmd
      chapters:
        - chapters/04_neutrino_mass_kinematics.qmd
        - chapters/05_electron_to_detector.qmd
        - chapters/06_mac_e_spectrometer.qmd
        - chapters/07_katrin.qmd
        - chapters/08_alternative_neutrino_mass.qmd
    - part: topics/03_vacuum_oscillations.qmd
      chapters:
        - chapters/09_vacuum_two_flavors.qmd
        - chapters/10_vacuum_pmns.qmd
    - part: topics/04_matter_oscillations.qmd
      chapters:
        - chapters/11_matter_refraction.qmd
        - chapters/12_matter_constant_density.qmd
        - chapters/13_matter_adiabatic_msw.qmd
        - chapters/14_matter_interference_pendulums.qmd
        - chapters/15_matter_three_flavors.qmd
        - chapters/16_oscillation_paradoxes.qmd
    - part: topics/05_standard_model.qmd
      chapters:
        - chapters/17_standard_model_neutrinos.qmd
        - chapters/18_electromagnetic_properties.qmd
        - chapters/19_sterile_neutrinos.qmd
    - part: topics/06_interactions_detection.qmd
      chapters:
        - chapters/20_neutrino_interactions.qmd
        - chapters/21_detection_methods.qmd
    - part: topics/07_sources.qmd
      chapters:
        - chapters/22_solar_neutrinos.qmd
        - chapters/23_atmospheric_neutrinos.qmd
        - chapters/24_accelerator_neutrinos.qmd
        - chapters/25_reactor_neutrinos.qmd
        - chapters/26_geophysical_neutrinos.qmd
    - part: topics/08_majorana_cosmic.qmd
      chapters:
        - chapters/27_neutrinoless_double_beta_decay.qmd
        - chapters/28_relic_neutrinos.qmd
        - chapters/29_uhe_astrophysical_neutrinos.qmd
        - chapters/30_supernova_neutrinos.qmd
    - part: topics/09_global_new_physics.qmd
      chapters:
        - chapters/31_global_analysis.qmd
        - chapters/32_mixing_cp_violation.qmd
        - chapters/33_new_physics.qmd
    - part: topics/10_applications.qmd
      chapters:
        - chapters/34_neutrino_tomography.qmd
        - chapters/35_reactor_monitoring.qmd

lang: ru-RU

# Subject profile for the canonical NeutrinoHit book components.
book-part-titles:
  - "ТЕМА 1. Нейтрино и слабое взаимодействие: симметрии, спин и спиральность"
  - "ТЕМА 2. Прямое измерение массы нейтрино"
  - "ТЕМА 3. Осцилляции нейтрино в вакууме"
  - "ТЕМА 4. Осцилляции нейтрино в веществе и квантовомеханические тонкости"
  - "ТЕМА 5. Нейтрино в Стандартной модели и за её пределами"
  - "ТЕМА 6. Взаимодействия и детектирование нейтрино"
  - "ТЕМА 7. Источники нейтрино"
  - "ТЕМА 8. Майорановская масса и нейтрино Вселенной"
  - "ТЕМА 9. Глобальная картина и новая физика"
  - "ТЕМА 10. Прикладная нейтринная физика"

# Optional editorial line breaks for printed titles. They do not change the
# corresponding HTML headings, PDF bookmarks or table-of-contents entries.
book-pdf-title-lines:
  "Нейтрино. Первое знакомство":
    - "Нейтрино."
    - "Первое знакомство"
  "ТЕМА 9. Глобальная картина и новая физика":
    - "ТЕМА 9. Глобальная картина"
    - "и новая физика"
  "Астрофизические нейтрино сверхвысоких энергий":
    - "Астрофизические"
    - "нейтрино сверхвысоких"
    - "энергий"
  "Смешивание и CP-нарушение":
    - "Смешивание"
    - "и CP-нарушение"

filters:
  - assets/filters/hide-book-index.lua
  - assets/filters/neutrinohit-book.lua
  - assets/filters/book-media.lua

crossref:
  fig-title: "Рис."
  fig-prefix: "рис."
  tbl-title: "Таблица"
  tbl-prefix: "табл."
  exr-title: "Задача"
  exr-prefix: "задаче"
  exm-title: "Пример"
  exm-prefix: "примере"

format:
  html:
    toc: true
    toc-depth: 2
    number-sections: true
    grid:
      sidebar-width: 260px
      body-width: 1050px
      margin-width: 230px
      gutter-width: 1rem
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
      - assets/covers/covers.css
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
    include-after-body: ../../../analytics/cloudflare-web-analytics.html
  pdf:
    documentclass: scrbook
    classoption:
      - open=any
    papersize: a4
    fontsize: 11pt
    geometry:
      - top=22mm
      - bottom=20mm
      - inner=20mm
      - outer=40mm
      - marginparwidth=28mm
      - marginparsep=5mm
      - headheight=8.5mm
      - headsep=5.5mm
      - footskip=9mm
    toc: true
    toc-depth: 2
    number-sections: true
    pdf-engine: lualatex
    include-in-header:
      - ../../../shared/latex/neutrinohit-book.tex
      - assets/latex/book.tex
      - assets/covers/covers.tex
    include-after-body: assets/covers/back-cover.tex
    template-partials:
      - assets/latex/before-body.tex
  epub:
    toc: true
    toc-depth: 2
    number-sections: true
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
    epub-cover-image: assets/images/book-cover.jpg
