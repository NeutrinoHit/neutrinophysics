  <path d="M190 200 C380 305 535 395 680 460 C825 520 1010 552 1235 555" fill="none" stroke="#2f6f9f" stroke-width="10" stroke-linecap="round"/>
  <path d="M190 207 C380 315 535 408 680 478 C805 535 945 552 1060 555" fill="none" stroke="#9a6b17" stroke-width="10" stroke-linecap="round"/>
