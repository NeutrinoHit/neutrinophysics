<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Результат опыта Ву</title>
  <desc id="desc">Электроны преимущественно испускаются против направления спина ядра кобальта-60.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172832"/><stop offset="1" stop-color="#0d171d"/></linearGradient>
    <marker id="spin" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#ffd166"/></marker>
    <marker id="electron" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#4ad4df"/></marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg2)"/>
  <g font-family="Avenir Next,Segoe UI,sans-serif">
    <text x="600" y="66" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">β-распад поляризованного ⁶⁰Co</text>
    <g transform="translate(110 112)">
      <circle cx="230" cy="235" r="52" fill="#b54a3a" stroke="#fff" stroke-width="4"/>
      <text x="230" y="244" fill="#fff" font-size="26" text-anchor="middle">⁶⁰Co</text>
      <path d="M230 175V55" stroke="#ffd166" stroke-width="10" stroke-linecap="round" marker-end="url(#spin)"/>
      <text x="260" y="78" fill="#ffd166" font-family="Libertinus Serif,serif" font-size="34" font-style="italic">I</text>
      <path d="M175 235H42" stroke="#4ad4df" stroke-width="11" stroke-linecap="round" marker-end="url(#electron)"/>
      <path d="M285 235H375" stroke="#4ad4df" stroke-width="5" stroke-linecap="round" marker-end="url(#electron)" opacity=".32"/>
      <text x="35" y="205" fill="#4ad4df" font-size="27">e⁻</text>
      <text x="230" y="365" fill="#e2ebee" font-size="24" text-anchor="middle">электроны летят преимущественно</text>
      <text x="230" y="398" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">против спина ядра</text>
    </g>
    <g transform="translate(610 126)">
      <line x1="55" y1="380" x2="510" y2="380" stroke="#9db0b8" stroke-width="4"/>
      <line x1="55" y1="35" x2="55" y2="380" stroke="#9db0b8" stroke-width="4"/>
      <line x1="55" y1="207" x2="510" y2="207" stroke="#ffd166" stroke-width="3" stroke-dasharray="11 9" opacity=".72"/>
      <path d="M55 90C192 120 350 291 510 332" fill="none" stroke="#4ad4df" stroke-width="10" stroke-linecap="round"/>
      <circle cx="55" cy="90" r="10" fill="#fff" stroke="#4ad4df" stroke-width="6"/>
      <circle cx="510" cy="332" r="10" fill="#fff" stroke="#4ad4df" stroke-width="6"/>
      <text x="22" y="49" fill="#fff" font-family="Libertinus Serif,serif" font-size="30" font-style="italic">W</text>
      <text x="492" y="425" fill="#fff" font-family="Libertinus Serif,serif" font-size="28">cos θ</text>
      <text x="44" y="416" fill="#c6d3d8" font-size="24">−1</text><text x="500" y="416" fill="#c6d3d8" font-size="24">+1</text>
      <text x="300" y="193" fill="#ffd166" font-size="20">если бы P сохранялась</text>
      <text x="280" y="486" fill="#fff" font-family="Libertinus Serif,serif" font-size="31" font-style="italic" text-anchor="middle">A ≃ −1</text>
    </g>
  </g>
</svg>
