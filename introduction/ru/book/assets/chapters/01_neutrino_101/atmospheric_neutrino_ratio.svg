<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Атмосферные нейтрино: путь сквозь Землю и отношение мюонного потока к электронному</title>
  <desc id="desc">Слева показаны короткая и длинная траектории атмосферных нейтрино, справа — схематическое уменьшение отношения R мю е от двух к единице.</desc>
  <defs>
    <radialGradient id="earth" cx="36%" cy="28%" r="72%">
      <stop offset="0" stop-color="#3e8bb5"/>
      <stop offset="0.72" stop-color="#164665"/>
      <stop offset="1" stop-color="#0b2639"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172832"/>
      <stop offset="1" stop-color="#0d171d"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#panel)"/>

  <g transform="translate(0 6)">
    <circle cx="330" cy="345" r="226" fill="none" stroke="#68c7d0" stroke-width="4" opacity=".46"/>
    <circle cx="330" cy="345" r="208" fill="url(#earth)"/>
    <circle cx="330" cy="345" r="128" fill="none" stroke="#80c7df" stroke-width="2" opacity=".18"/>
    <circle cx="330" cy="345" r="65" fill="#ffb45a" opacity=".18"/>
    <path d="M249 192c50-28 96-24 124 7l-19 44-52-6-30 35-52-14-12-38z" fill="#80b18b" opacity=".76"/>
    <path d="M390 370c47-30 89-16 117 19l-10 51-36 16-20 51-49 8-28-48 17-42-20-32z" fill="#80b18b" opacity=".7"/>

    <path d="M472 182L487 199" stroke="#ffd166" stroke-width="7" stroke-linecap="round"/>
    <path d="M162 493Q324 234 487 199" fill="none" stroke="#4ad4df" stroke-width="6" stroke-linecap="round"/>
    <circle cx="162" cy="493" r="9" fill="#4ad4df" filter="url(#glow)"/>
    <circle cx="487" cy="199" r="9" fill="#ffd166"/>
    <path d="M499 183l18 15-15 18" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="337" y="584" fill="#d9e8ec" font-family="Avenir Next,Segoe UI,sans-serif" font-size="24" text-anchor="middle">база до 12 800 км</text>
    <text x="504" y="162" fill="#ffd166" font-family="Avenir Next,Segoe UI,sans-serif" font-size="21">детектор</text>
  </g>

  <g transform="translate(625 92)" font-family="Avenir Next,Segoe UI,sans-serif">
    <text x="250" y="0" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">R<tspan dy="9" font-size="22">μ/e</tspan></text>
    <text x="250" y="44" fill="#b9cbd1" font-size="19" text-anchor="middle">отношение потоков</text>
    <line x1="46" y1="394" x2="500" y2="394" stroke="#9db0b8" stroke-width="3"/>
    <line x1="46" y1="84" x2="46" y2="394" stroke="#9db0b8" stroke-width="3"/>
    <line x1="46" y1="110" x2="500" y2="110" stroke="#ffd166" stroke-width="2" stroke-dasharray="10 9" opacity=".75"/>
    <text x="24" y="119" fill="#fff" font-size="23">2</text>
    <text x="24" y="361" fill="#fff" font-size="23">1</text>
    <text x="118" y="96" fill="#ffd166" font-size="18">без осцилляций</text>
    <path d="M46 110 C135 112 174 138 222 207 S317 348 500 352" fill="none" stroke="#4ad4df" stroke-width="9" stroke-linecap="round"/>
    <circle cx="46" cy="110" r="11" fill="#fff" stroke="#4ad4df" stroke-width="6"/>
    <circle cx="500" cy="352" r="11" fill="#fff" stroke="#4ad4df" stroke-width="6"/>
    <text x="46" y="430" fill="#c5d3d8" font-size="20" text-anchor="middle">20 км</text>
    <text x="500" y="430" fill="#c5d3d8" font-size="20" text-anchor="middle">12 800 км</text>
    <text x="273" y="472" fill="#fff" font-size="23" text-anchor="middle">длина пути L</text>
  </g>
  <text x="600" y="656" fill="#92a7ae" font-family="Avenir Next,Segoe UI,sans-serif" font-size="20" text-anchor="middle">Схематическая зависимость, усреднённая по энергиям</text>
</svg>
