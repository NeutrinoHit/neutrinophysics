  <text x="370" y="505" text-anchor="middle" class="m blue" font-size="42" font-weight="700">h = +1</text>
  <text x="1030" y="505" text-anchor="middle" class="m blue" font-size="42" font-weight="700">h′ = −1</text>
  <rect x="65" y="565" width="1270" height="135" rx="25" fill="#e9edf7"/>
  <circle cx="190" cy="632" r="37" fill="#465b8c"/><text x="190" y="647" text-anchor="middle" class="m" font-size="40" fill="#fff">ν</text>
