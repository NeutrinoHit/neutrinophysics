  <rect width="1400" height="760" rx="34" fill="#f6f7fb"/>
  <text x="700" y="70" text-anchor="middle" class="s ink" font-size="41" font-weight="700">Один спин — два знака импульса</text>
  <rect x="65" y="115" width="610" height="410" rx="26" fill="#fff" stroke="#d8ddea" stroke-width="4"/>
