    <style>.s{font-family:'Avenir Next','Segoe UI',sans-serif}.m{font-family:'Iowan Old Style',Georgia,serif}.ink{fill:#18262f}.muted{fill:#687984}.blue{fill:#465b8c}.v{stroke:#18262f;stroke-width:9;stroke-linecap:round;marker-end:url(#arrow)}</style>
