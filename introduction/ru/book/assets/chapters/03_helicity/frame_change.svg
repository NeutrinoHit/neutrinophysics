  <text x="1030" y="170" text-anchor="middle" class="s muted" font-size="28" font-weight="700">наблюдатель обогнал частицу</text>
  <line x1="130" y1="366" x2="610" y2="366" stroke="#c9d0d5" stroke-width="8" stroke-linecap="round"/>
  <line x1="790" y1="366" x2="1270" y2="366" stroke="#c9d0d5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="340" cy="338" r="61" fill="#465b8c"/><text x="340" y="357" text-anchor="middle" class="m" font-size="56" fill="#fff">ν</text>
  <circle cx="1060" cy="338" r="61" fill="#465b8c"/><text x="1060" y="357" text-anchor="middle" class="m" font-size="56" fill="#fff">ν</text>
