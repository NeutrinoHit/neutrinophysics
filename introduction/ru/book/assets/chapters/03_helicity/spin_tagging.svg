<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18262f"/></marker>
    <style>.s{font-family:'Avenir Next','Segoe UI',sans-serif}.m{font-family:'Iowan Old Style',Georgia,serif}.ink{fill:#18262f}.muted{fill:#687984}.blue{fill:#465b8c}.arr{stroke:#18262f;stroke-width:8;stroke-linecap:round;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="760" rx="34" fill="#f6f7fb"/>
  <text x="700" y="68" text-anchor="middle" class="s ink" font-size="40" font-weight="700">Ядро и фотон сохраняют спиновую метку</text>
  <line x1="95" y1="355" x2="1305" y2="355" stroke="#d8ddea" stroke-width="4"/>
  <rect x="75" y="135" width="310" height="445" rx="28" fill="#fff" stroke="#d8ddea" stroke-width="4"/>
  <rect x="545" y="135" width="310" height="445" rx="28" fill="#fff" stroke="#d8ddea" stroke-width="4"/>
  <rect x="1015" y="135" width="310" height="445" rx="28" fill="#fff" stroke="#d8ddea" stroke-width="4"/>
  <path d="M 405 355 H 515" class="arr"/><path d="M 875 355 H 985" class="arr"/>
  <circle cx="230" cy="295" r="78" fill="#465b8c"/><text x="230" y="315" text-anchor="middle" class="m" font-size="54" fill="#fff">A</text>
  <circle cx="145" cy="210" r="31" fill="#c7472f"/><text x="145" y="221" text-anchor="middle" class="m" font-size="28" fill="#fff">e⁻</text>
  <text x="230" y="420" text-anchor="middle" class="s ink" font-size="31" font-weight="700">электронный захват</text>
  <text x="230" y="466" text-anchor="middle" class="m muted" font-size="27">A(0) + e⁻</text>
  <circle cx="700" cy="285" r="76" fill="#465b8c"/><text x="700" y="305" text-anchor="middle" class="m" font-size="51" fill="#fff">B*</text>
  <path d="M 700 205 V 120" class="arr"/><text x="720" y="110" class="m ink" font-size="28">m = +1</text>
  <circle cx="795" cy="420" r="38" fill="#0f6972"/><text x="795" y="434" text-anchor="middle" class="m" font-size="37" fill="#fff">ν</text>
  <path d="M 760 420 H 610" class="arr"/><path d="M 830 420 H 950" class="arr"/>
  <text x="700" y="510" text-anchor="middle" class="s ink" font-size="31" font-weight="700">отдача и нейтрино</text>
  <text x="700" y="550" text-anchor="middle" class="m blue" font-size="30">m(B*) = +1 ⇒ hν = −1</text>
  <circle cx="1170" cy="285" r="76" fill="#465b8c"/><text x="1170" y="305" text-anchor="middle" class="m" font-size="53" fill="#fff">B</text>
  <path d="M 1160 205 V 120" class="arr"/>
  <path d="M 1160 205 C 1100 180, 1110 140, 1050 140" fill="none" stroke="#c7472f" stroke-width="9" stroke-linecap="round"/>
  <text x="1030" y="129" text-anchor="end" class="m" font-size="34" fill="#c7472f">γ</text>
  <text x="1170" y="420" text-anchor="middle" class="s ink" font-size="31" font-weight="700">быстрый γ-переход</text>
  <text x="1170" y="466" text-anchor="middle" class="m blue" font-size="30">hγ = hν</text>
  <rect x="180" y="625" width="1040" height="78" rx="20" fill="#e9edf7"/>
  <text x="700" y="675" text-anchor="middle" class="s ink" font-size="30" font-weight="700">спиральность ν → проекция B* → круговая поляризация γ</text>
</svg>
