<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
  <title>Приближённая матрица квадратов модулей элементов PMNS</title>
  <rect width="1200" height="650" fill="#f5f8fa"/>
  <text x="600" y="72" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#18262f">Солнечные + атмосферные данные</text>
  <text x="600" y="118" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="25" fill="#596c78">первое приближение: электронная доля третьей моды равна нулю</text>

  <text x="188" y="204" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="31" fill="#304853">|U|²</text>
  <text x="407" y="204" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="31" fill="#304853">ν₁</text>
  <text x="664" y="204" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="31" fill="#304853">ν₂</text>
  <text x="921" y="204" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="31" fill="#304853">ν₃</text>

  <text x="188" y="292" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="34" fill="#18262f">e</text>
  <text x="188" y="405" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="34" fill="#18262f">μ</text>
  <text x="188" y="518" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="34" fill="#18262f">τ</text>

  <g stroke="#8eb3c2" stroke-width="2">
    <rect x="285" y="226" width="244" height="91" rx="10" fill="#e8f2f6"/>
    <rect x="542" y="226" width="244" height="91" rx="10" fill="#ffefca"/>
    <rect x="799" y="226" width="244" height="91" rx="10" fill="#edf3f6"/>
    <rect x="285" y="339" width="244" height="91" rx="10" fill="#e8f2f6"/>
    <rect x="542" y="339" width="244" height="91" rx="10" fill="#e8f2f6"/>
    <rect x="799" y="339" width="244" height="91" rx="10" fill="#ffefca"/>
    <rect x="285" y="452" width="244" height="91" rx="10" fill="#e8f2f6"/>
    <rect x="542" y="452" width="244" height="91" rx="10" fill="#e8f2f6"/>
    <rect x="799" y="452" width="244" height="91" rx="10" fill="#e8f2f6"/>
  </g>

  <g text-anchor="middle" font-family="PT Serif,Georgia,serif" font-size="43" fill="#172b35">
    <text x="407" y="284">2/3</text><text x="664" y="284">1/3</text><text x="921" y="284">0</text>
    <text x="407" y="397">1/6</text><text x="664" y="397">1/3</text><text x="921" y="397">1/2</text>
    <text x="407" y="510">1/6</text><text x="664" y="510">1/3</text><text x="921" y="510">1/2</text>
  </g>

  <text x="600" y="611" text-anchor="middle" font-family="PT Sans,Arial,sans-serif" font-size="27" fill="#426676">Жёлтые клетки задают солнечное и атмосферное измерения.</text>
</svg>
